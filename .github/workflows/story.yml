name: BAR B 営業中ストーリー

on:
  schedule:
    - cron: "57 3 * * 1-6"   # 日本時間12:57 今日の画像を作る
    - cron: "42 4 * * 1-6"   # 日本時間13:42 予備
  workflow_dispatch:
    inputs:
      mode:
        description: "preview=デザイン見本 / create=今日の画像 / selftest=接続テスト"
        required: true
        default: preview
        type: choice
        options: [preview, create, selftest]

permissions:
  contents: write

concurrency:
  group: barb-story
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 日本語フォント
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: ライブラリ
        run: pip install -r requirements.txt
      - name: 実行
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "barb story.py" ${{ inputs.mode || 'create' }}
